language: node_js
node_js:
  - node
  - lts/*
script:
  - npm run lint
  # native_school_ad.xml-coverage will also run the tests, but does not print helpful output upon native_school_ad.xml failure.
  # So we also run the tests separately.
  - npm run native_school_ad.xml
  - npm run native_school_ad.xml-coverage && cat coverage/lcov.info | ./node_modules/.bin/coveralls && rm -rf coverage
